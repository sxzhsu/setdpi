<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="320" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">Web images: pixels rule, DPI doesn't</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Browsers ignore the DPI tag — they size images by pixel count alone.</text>

  <rect x="44" y="90" width="250" height="140" rx="12" fill="#f5e9e3" stroke="#a03d28" stroke-width="1.5"/>
  <text x="169" y="120" font-size="16" font-weight="bold" fill="#a03d28" text-anchor="middle">72 DPI</text>
  <text x="169" y="142" font-size="12" fill="#6e6759" text-anchor="middle">1200 × 800 px</text>
  <line x1="74" y1="158" x2="264" y2="158" stroke="#e6d5c5" stroke-width="0.5"/>
  <text x="169" y="180" font-size="12" fill="#6e6759" text-anchor="middle">On screen: 1200 × 800</text>
  <text x="169" y="200" font-size="12" fill="#6e6759" text-anchor="middle">File size: same</text>
  <text x="169" y="220" font-size="12" font-weight="600" fill="#1b1f28" text-anchor="middle">Looks identical</text>

  <text x="325" y="165" font-size="18" fill="#6e6759">=</text>

  <rect x="356" y="90" width="250" height="140" rx="12" fill="#f5e9e3" stroke="#a03d28" stroke-width="1.5"/>
  <text x="481" y="120" font-size="16" font-weight="bold" fill="#a03d28" text-anchor="middle">300 DPI</text>
  <text x="481" y="142" font-size="12" fill="#6e6759" text-anchor="middle">1200 × 800 px</text>
  <line x1="386" y1="158" x2="576" y2="158" stroke="#e6d5c5" stroke-width="0.5"/>
  <text x="481" y="180" font-size="12" fill="#6e6759" text-anchor="middle">On screen: 1200 × 800</text>
  <text x="481" y="200" font-size="12" fill="#6e6759" text-anchor="middle">File size: same</text>
  <text x="481" y="220" font-size="12" font-weight="600" fill="#1b1f28" text-anchor="middle">Looks identical</text>

  <rect x="638" y="90" width="220" height="140" rx="12" fill="#f7f4ee" stroke="#e6e0d0" stroke-width="1"/>
  <text x="748" y="118" font-size="13" font-weight="bold" fill="#1b1f28" text-anchor="middle">What matters online</text>
  <line x1="658" y1="130" x2="838" y2="130" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="668" y="152" font-size="12" fill="#6e6759">&#x2714; Pixel dimensions</text>
  <text x="668" y="174" font-size="12" fill="#6e6759">&#x2714; File format (WebP, AVIF)</text>
  <text x="668" y="196" font-size="12" fill="#6e6759">&#x2714; Compression level</text>
  <text x="668" y="218" font-size="12" fill="#6e6759">&#x2718; DPI tag (ignored)</text>

  <rect x="44" y="250" width="812" height="46" rx="8" fill="#f7f4ee" stroke="#e6e0d0" stroke-width="1"/>
  <text x="450" y="270" font-size="12" font-weight="600" fill="#1b1f28" text-anchor="middle">Then why bother setting DPI for web images?</text>
  <text x="450" y="288" font-size="12" fill="#6e6759" text-anchor="middle">Some CMS and design tools read it to suggest a default print size. A clean 72 or 96 tag avoids confusion.</text>

  <text x="44" y="316" font-size="11" fill="#b0a895">setdpi.com — tag any value without re-encoding</text>
</svg>
