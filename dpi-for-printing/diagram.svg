<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">DPI by print type</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Match the density to the viewing distance, not a single magic number.</text>
  <rect x="44" y="88" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="109" font-size="12" font-weight="bold" fill="#6e6759">PRODUCT</text>
  <text x="320" y="109" font-size="12" font-weight="bold" fill="#6e6759">DPI</text>
  <text x="450" y="109" font-size="12" font-weight="bold" fill="#6e6759">VIEWING DISTANCE</text>
  <text x="700" y="109" font-size="12" font-weight="bold" fill="#6e6759">WHY</text>
  <line x1="44" y1="124" x2="856" y2="124" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="148" font-size="13" font-weight="600" fill="#1b1f28">Photos (4×6, 5×7, 8×10)</text>
  <text x="320" y="148" font-size="13" font-weight="700" fill="#a03d28">300</text>
  <text x="450" y="148" font-size="13" fill="#6e6759">Arm's length</text>
  <text x="700" y="148" font-size="12" fill="#6e6759">Lab standard</text>
  <line x1="44" y1="164" x2="856" y2="164" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="188" font-size="13" font-weight="600" fill="#1b1f28">Business cards, flyers</text>
  <text x="320" y="188" font-size="13" font-weight="700" fill="#a03d28">300</text>
  <text x="450" y="188" font-size="13" fill="#6e6759">Hand-held</text>
  <text x="700" y="188" font-size="12" fill="#6e6759">Sharp text + images</text>
  <line x1="44" y1="204" x2="856" y2="204" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="228" font-size="13" font-weight="600" fill="#1b1f28">Posters, banners</text>
  <text x="320" y="228" font-size="13" font-weight="700" fill="#b45309">150–200</text>
  <text x="450" y="228" font-size="13" fill="#6e6759">Several feet</text>
  <text x="700" y="228" font-size="12" fill="#6e6759">Distance hides dots</text>
  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="268" font-size="13" font-weight="600" fill="#1b1f28">Canvas</text>
  <text x="320" y="268" font-size="13" font-weight="700" fill="#b45309">150–200</text>
  <text x="450" y="268" font-size="13" fill="#6e6759">Wall distance</text>
  <text x="700" y="268" font-size="12" fill="#6e6759">Texture breaks detail</text>
  <line x1="44" y1="284" x2="856" y2="284" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="308" font-size="13" font-weight="600" fill="#1b1f28">Fine art giclée / line art</text>
  <text x="320" y="308" font-size="13" font-weight="700" fill="#2e7d4f">300–600</text>
  <text x="450" y="308" font-size="13" fill="#6e6759">Close inspection</text>
  <text x="700" y="308" font-size="12" fill="#6e6759">Crisp edges matter</text>
  <text x="44" y="336" font-size="11" fill="#b0a895">setdpi.com — set the DPI tag without re-encoding</text>
</svg>
