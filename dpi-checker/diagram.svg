<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">How this checker reads DPI</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Drop a JPG or PNG. Metadata is read in the browser. The file is never rewritten and never uploaded.</text>

  <rect x="44" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="64" y="114" font-size="18" font-weight="bold" fill="#a03d28">1</text>
  <text x="64" y="140" font-size="13" font-weight="600" fill="#1b1f28">Drop files</text>
  <text x="64" y="160" font-size="12" fill="#6e6759">Up to 50 JPG / PNG</text>
  <text x="64" y="176" font-size="12" fill="#6e6759">read locally, no upload</text>

  <polygon points="232,138 246,132 246,144" fill="#e6e0d0"/>

  <rect x="254" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="274" y="114" font-size="18" font-weight="bold" fill="#a03d28">2</text>
  <text x="274" y="140" font-size="13" font-weight="600" fill="#1b1f28">Read density</text>
  <text x="274" y="160" font-size="12" fill="#6e6759">JPEG: EXIF, then JFIF</text>
  <text x="274" y="176" font-size="12" fill="#6e6759">PNG: pHYs chunk</text>

  <polygon points="442,138 456,132 456,144" fill="#e6e0d0"/>

  <rect x="464" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="484" y="114" font-size="18" font-weight="bold" fill="#a03d28">3</text>
  <text x="484" y="140" font-size="13" font-weight="600" fill="#1b1f28">Show the numbers</text>
  <text x="484" y="160" font-size="12" fill="#6e6759">DPI, pixel width × height</text>
  <text x="484" y="176" font-size="12" fill="#6e6759">print size = pixels ÷ DPI</text>

  <polygon points="652,138 666,132 666,144" fill="#e6e0d0"/>

  <rect x="674" y="88" width="182" height="100" rx="12" fill="#f7f4ee"/>
  <text x="694" y="114" font-size="18" font-weight="bold" fill="#a03d28">4</text>
  <text x="694" y="140" font-size="13" font-weight="600" fill="#1b1f28">Stop — read only</text>
  <text x="694" y="160" font-size="12" fill="#6e6759">No rewrite, no resample</text>
  <text x="694" y="176" font-size="12" fill="#6e6759">Missing tag is reported</text>

  <rect x="44" y="208" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="229" font-size="12" font-weight="bold" fill="#6e6759">SOURCE</text>
  <text x="280" y="229" font-size="12" font-weight="bold" fill="#6e6759">WHAT IT READS</text>
  <text x="620" y="229" font-size="12" font-weight="bold" fill="#6e6759">IF MISSING</text>

  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="268" font-size="13" font-weight="600" fill="#1b1f28">JPEG EXIF</text>
  <text x="280" y="268" font-size="13" fill="#6e6759">XResolution — preferred when present</text>
  <text x="620" y="268" font-size="13" fill="#6e6759">Fall back to JFIF</text>

  <line x1="44" y1="284" x2="856" y2="284" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="308" font-size="13" font-weight="600" fill="#1b1f28">JPEG JFIF / PNG</text>
  <text x="280" y="308" font-size="13" fill="#6e6759">APP0 Xdensity · pHYs px/m × 0.0254</text>
  <text x="620" y="308" font-size="13" fill="#6e6759">“No DPI metadata found”</text>

  <text x="44" y="352" font-size="11" fill="#b0a895">setdpi.com — check image DPI without uploading</text>
</svg>
