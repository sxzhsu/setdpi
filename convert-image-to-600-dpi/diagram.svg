<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">When 600 DPI actually matters</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">High-quality print viewed close — twice 300, so the same pixels occupy half the paper. Not the photo-lab habit.</text>

  <rect x="44" y="88" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="109" font-size="12" font-weight="bold" fill="#6e6759">JOB</text>
  <text x="320" y="109" font-size="12" font-weight="bold" fill="#6e6759">WHY 600</text>
  <text x="640" y="109" font-size="12" font-weight="bold" fill="#6e6759">EXAMPLE AT 600</text>

  <line x1="44" y1="124" x2="856" y2="124" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="148" font-size="13" font-weight="600" fill="#1b1f28">Fine art giclée</text>
  <text x="320" y="148" font-size="12" fill="#6e6759">RIP not interpolating a 300 tag</text>
  <text x="640" y="148" font-size="12" fill="#6e6759">3600 × 5400 → 6 × 9 in</text>

  <line x1="44" y1="164" x2="856" y2="164" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="188" font-size="13" font-weight="600" fill="#1b1f28">Line art / charts</text>
  <text x="320" y="188" font-size="12" fill="#6e6759">Thin rules stay crisp; 300 softens</text>
  <text x="640" y="188" font-size="12" fill="#6e6759">Journals: 600 for line art</text>

  <line x1="44" y1="204" x2="856" y2="204" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="228" font-size="13" font-weight="600" fill="#1b1f28">Medical / scientific</text>
  <text x="320" y="228" font-size="12" fill="#6e6759">Inspected close or under a loupe</text>
  <text x="640" y="228" font-size="12" fill="#6e6759">Radiology, microscope, figures</text>

  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="268" font-size="13" font-weight="600" fill="#1b1f28">Archival scans</text>
  <text x="320" y="268" font-size="12" fill="#6e6759">Future enlargement keeps the grain</text>
  <text x="640" y="268" font-size="12" fill="#6e6759">Photos, maps, manuscripts</text>

  <rect x="44" y="292" width="250" height="52" rx="8" fill="#f7f4ee"/>
  <text x="64" y="314" font-size="12" fill="#6e6759">3600 × 5400 px @ 600</text>
  <text x="64" y="334" font-size="14" font-weight="700" fill="#a03d28">6 × 9 in</text>

  <rect x="310" y="292" width="250" height="52" rx="8" fill="#f7f4ee"/>
  <text x="330" y="314" font-size="12" fill="#6e6759">Same pixels @ 300</text>
  <text x="330" y="334" font-size="14" font-weight="700" fill="#a03d28">12 × 18 in</text>

  <rect x="576" y="292" width="280" height="52" rx="8" fill="#f7f4ee"/>
  <text x="596" y="314" font-size="12" fill="#6e6759">4800 × 6000 px @ 600</text>
  <text x="596" y="334" font-size="14" font-weight="700" fill="#a03d28">8 × 10 in</text>

  <text x="44" y="372" font-size="11" fill="#b0a895">setdpi.com — set 600 DPI without re-encoding</text>
</svg>
