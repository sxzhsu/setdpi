<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">How a TIFF stores — and rewrites — DPI</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">XResolution, YResolution, ResolutionUnit in the first IFD. Pixel data, compression and extra pages stay untouched.</text>

  <rect x="44" y="84" width="390" height="100" rx="12" fill="#f7f4ee"/>
  <text x="64" y="114" font-size="18" font-weight="bold" fill="#a03d28">In place</text>
  <text x="64" y="138" font-size="13" fill="#6e6759">All three tags present and well formed</text>
  <text x="64" y="160" font-size="13" font-weight="600" fill="#1b1f28">16 rational bytes + unit field</text>
  <text x="64" y="178" font-size="12" fill="#6e6759">File length unchanged — nothing moves</text>

  <rect x="466" y="84" width="390" height="100" rx="12" fill="#f7f4ee"/>
  <text x="486" y="114" font-size="18" font-weight="bold" fill="#a03d28">Rebuild</text>
  <text x="486" y="138" font-size="13" fill="#6e6759">Any tag missing or malformed</text>
  <text x="486" y="160" font-size="13" font-weight="600" fill="#1b1f28">New IFD appended; header offset updated</text>
  <text x="486" y="178" font-size="12" fill="#6e6759">Old IFD left as dead bytes no reader visits</text>

  <rect x="44" y="204" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="225" font-size="12" font-weight="bold" fill="#6e6759">TAG</text>
  <text x="160" y="225" font-size="12" font-weight="bold" fill="#6e6759">NAME</text>
  <text x="400" y="225" font-size="12" font-weight="bold" fill="#6e6759">TYPE</text>
  <text x="680" y="225" font-size="12" font-weight="bold" fill="#6e6759">THIS PAGE WRITES</text>

  <line x1="44" y1="240" x2="856" y2="240" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="264" font-size="14" font-weight="700" fill="#a03d28">282</text>
  <text x="160" y="264" font-size="13" font-weight="600" fill="#1b1f28">XResolution</text>
  <text x="400" y="264" font-size="12" fill="#6e6759">RATIONAL — 8 bytes at offset</text>
  <text x="680" y="264" font-size="13" fill="#6e6759">target / 1</text>

  <line x1="44" y1="280" x2="856" y2="280" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="304" font-size="14" font-weight="700" fill="#a03d28">283</text>
  <text x="160" y="304" font-size="13" font-weight="600" fill="#1b1f28">YResolution</text>
  <text x="400" y="304" font-size="12" fill="#6e6759">RATIONAL — 8 bytes at offset</text>
  <text x="680" y="304" font-size="13" fill="#6e6759">target / 1</text>

  <line x1="44" y1="320" x2="856" y2="320" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="344" font-size="14" font-weight="700" fill="#a03d28">296</text>
  <text x="160" y="344" font-size="13" font-weight="600" fill="#1b1f28">ResolutionUnit</text>
  <text x="400" y="344" font-size="12" fill="#6e6759">SHORT — inline, first 2 bytes</text>
  <text x="680" y="344" font-size="13" fill="#6e6759">2 (inch)</text>

  <text x="44" y="372" font-size="12" fill="#6e6759">Multi-page: later IFDs stay reachable and byte-identical. BigTIFF (magic 43) is skipped. Compression never decoded.</text>
  <text x="44" y="392" font-size="11" fill="#b0a895">setdpi.com — rewrite TIFF resolution tags without touching pixel data</text>
</svg>
