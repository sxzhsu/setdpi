<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">DPI vs PPI — side by side</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Same math, different hardware. Both measure dots (or pixels) per inch.</text>

  <rect x="44" y="90" width="390" height="220" rx="14" fill="#f5e9e3" stroke="#a03d28" stroke-width="1.5"/>
  <text x="239" y="122" font-size="22" font-weight="bold" fill="#a03d28" text-anchor="middle">DPI</text>
  <text x="239" y="146" font-size="13" fill="#6e6759" text-anchor="middle">Dots Per Inch</text>
  <line x1="74" y1="162" x2="404" y2="162" stroke="#e6d5c5" stroke-width="1"/>
  <text x="74" y="186" font-size="12" font-weight="600" fill="#1b1f28">Domain</text>
  <text x="200" y="186" font-size="12" fill="#6e6759">Print — printers, scanners</text>
  <text x="74" y="210" font-size="12" font-weight="600" fill="#1b1f28">What's a "dot"</text>
  <text x="200" y="210" font-size="12" fill="#6e6759">Ink droplet on paper</text>
  <text x="74" y="234" font-size="12" font-weight="600" fill="#1b1f28">Typical range</text>
  <text x="200" y="234" font-size="12" fill="#6e6759">150–2400 for consumer printers</text>
  <text x="74" y="258" font-size="12" font-weight="600" fill="#1b1f28">Higher =</text>
  <text x="200" y="258" font-size="12" fill="#6e6759">More ink drops → finer detail</text>
  <text x="74" y="282" font-size="12" font-weight="600" fill="#1b1f28">Who sets it</text>
  <text x="200" y="282" font-size="12" fill="#6e6759">Printer hardware + driver</text>

  <rect x="466" y="90" width="390" height="220" rx="14" fill="#e8eef5" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="661" y="122" font-size="22" font-weight="bold" fill="#3b6ea5" text-anchor="middle">PPI</text>
  <text x="661" y="146" font-size="13" fill="#6e6759" text-anchor="middle">Pixels Per Inch</text>
  <line x1="496" y1="162" x2="826" y2="162" stroke="#c5d5e6" stroke-width="1"/>
  <text x="496" y="186" font-size="12" font-weight="600" fill="#1b1f28">Domain</text>
  <text x="622" y="186" font-size="12" fill="#6e6759">Screen — monitors, phones</text>
  <text x="496" y="210" font-size="12" font-weight="600" fill="#1b1f28">What's a "pixel"</text>
  <text x="622" y="210" font-size="12" fill="#6e6759">Lit sub-pixel on a display</text>
  <text x="496" y="234" font-size="12" font-weight="600" fill="#1b1f28">Typical range</text>
  <text x="622" y="234" font-size="12" fill="#6e6759">72–460 for modern screens</text>
  <text x="496" y="258" font-size="12" font-weight="600" fill="#1b1f28">Higher =</text>
  <text x="622" y="258" font-size="12" fill="#6e6759">More pixels → sharper text</text>
  <text x="496" y="282" font-size="12" font-weight="600" fill="#1b1f28">Who sets it</text>
  <text x="622" y="282" font-size="12" fill="#6e6759">Display panel (fixed)</text>

  <rect x="44" y="322" width="812" height="28" rx="6" fill="#f7f4ee"/>
  <text x="450" y="341" font-size="12" fill="#6e6759" text-anchor="middle">The image file's DPI tag tells software how big to print it — it doesn't affect what you see on screen.</text>
  <text x="44" y="358" font-size="11" fill="#b0a895">setdpi.com — change the tag, keep every pixel</text>
</svg>
