<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">Scanning DPI cheat sheet</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Higher scan DPI = more pixels captured. Pick the setting for what you'll do with the scan.</text>

  <rect x="44" y="88" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="109" font-size="12" font-weight="bold" fill="#6e6759">GOAL</text>
  <text x="300" y="109" font-size="12" font-weight="bold" fill="#6e6759">SCAN DPI</text>
  <text x="440" y="109" font-size="12" font-weight="bold" fill="#6e6759">FILE SIZE (4×6 PHOTO)</text>
  <text x="700" y="109" font-size="12" font-weight="bold" fill="#6e6759">RESULT</text>

  <line x1="44" y1="124" x2="856" y2="124" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="148" font-size="13" font-weight="600" fill="#1b1f28">Quick digital copy</text>
  <text x="300" y="148" font-size="14" font-weight="700" fill="#a03d28">150</text>
  <text x="440" y="148" font-size="12" fill="#6e6759">~0.5 MB (600 × 900 px)</text>
  <text x="700" y="148" font-size="12" fill="#6e6759">Fine for email / web</text>

  <line x1="44" y1="164" x2="856" y2="164" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="188" font-size="13" font-weight="600" fill="#1b1f28">Reprint at same size</text>
  <text x="300" y="188" font-size="14" font-weight="700" fill="#a03d28">300</text>
  <text x="440" y="188" font-size="12" fill="#6e6759">~2 MB (1200 × 1800 px)</text>
  <text x="700" y="188" font-size="12" fill="#6e6759">1:1 lab-quality reprint</text>

  <line x1="44" y1="204" x2="856" y2="204" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="228" font-size="13" font-weight="600" fill="#1b1f28">Enlarge × 2</text>
  <text x="300" y="228" font-size="14" font-weight="700" fill="#a03d28">600</text>
  <text x="440" y="228" font-size="12" fill="#6e6759">~8 MB (2400 × 3600 px)</text>
  <text x="700" y="228" font-size="12" fill="#6e6759">Doubles print size</text>

  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="268" font-size="13" font-weight="600" fill="#1b1f28">Archival / maximum detail</text>
  <text x="300" y="268" font-size="14" font-weight="700" fill="#a03d28">1200</text>
  <text x="440" y="268" font-size="12" fill="#6e6759">~30 MB (4800 × 7200 px)</text>
  <text x="700" y="268" font-size="12" fill="#6e6759">Preserves everything</text>

  <line x1="44" y1="284" x2="856" y2="284" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="308" font-size="13" font-weight="600" fill="#1b1f28">Slides / negatives</text>
  <text x="300" y="308" font-size="14" font-weight="700" fill="#a03d28">2400–4800</text>
  <text x="440" y="308" font-size="12" fill="#6e6759">~50–200 MB per frame</text>
  <text x="700" y="308" font-size="12" fill="#6e6759">Tiny source needs more</text>

  <rect x="44" y="324" width="812" height="20" rx="4" fill="#f7f4ee"/>
  <text x="450" y="339" font-size="11" fill="#6e6759" text-anchor="middle">Tip: scan once at the highest DPI you'll ever need — you can always set a lower DPI tag later with SetDPI.</text>
  <text x="44" y="358" font-size="11" fill="#b0a895">setdpi.com — change the DPI tag after scanning, no re-scan needed</text>
</svg>
