<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">300 DPI vs lower — what you actually see</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Same pixel grid, different dot density on paper.</text>

  <rect x="44" y="90" width="250" height="200" rx="14" fill="#f7f4ee" stroke="#e6e0d0" stroke-width="1"/>
  <text x="169" y="118" font-size="15" font-weight="bold" fill="#a03d28" text-anchor="middle">72 DPI</text>
  <rect x="74" y="134" width="190" height="100" rx="4" fill="#e6e0d0"/>
  <line x1="74" y1="154" x2="264" y2="154" stroke="#fffdf9" stroke-width="2"/>
  <line x1="74" y1="174" x2="264" y2="174" stroke="#fffdf9" stroke-width="2"/>
  <line x1="74" y1="194" x2="264" y2="194" stroke="#fffdf9" stroke-width="2"/>
  <line x1="74" y1="214" x2="264" y2="214" stroke="#fffdf9" stroke-width="2"/>
  <line x1="138" y1="134" x2="138" y2="234" stroke="#fffdf9" stroke-width="2"/>
  <line x1="201" y1="134" x2="201" y2="234" stroke="#fffdf9" stroke-width="2"/>
  <text x="169" y="258" font-size="11" fill="#6e6759" text-anchor="middle">Large dots, visible grid</text>
  <text x="169" y="276" font-size="11" fill="#6e6759" text-anchor="middle">Prints 16.7 × 11.1 in</text>

  <rect x="325" y="90" width="250" height="200" rx="14" fill="#f7f4ee" stroke="#e6e0d0" stroke-width="1"/>
  <text x="450" y="118" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">150 DPI</text>
  <rect x="355" y="134" width="190" height="100" rx="4" fill="#d5cfc0"/>
  <line x1="355" y1="147" x2="545" y2="147" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="160" x2="545" y2="160" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="173" x2="545" y2="173" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="186" x2="545" y2="186" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="199" x2="545" y2="199" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="212" x2="545" y2="212" stroke="#fffdf9" stroke-width="1"/>
  <line x1="355" y1="225" x2="545" y2="225" stroke="#fffdf9" stroke-width="1"/>
  <line x1="387" y1="134" x2="387" y2="234" stroke="#fffdf9" stroke-width="1"/>
  <line x1="419" y1="134" x2="419" y2="234" stroke="#fffdf9" stroke-width="1"/>
  <line x1="451" y1="134" x2="451" y2="234" stroke="#fffdf9" stroke-width="1"/>
  <line x1="483" y1="134" x2="483" y2="234" stroke="#fffdf9" stroke-width="1"/>
  <line x1="515" y1="134" x2="515" y2="234" stroke="#fffdf9" stroke-width="1"/>
  <text x="450" y="258" font-size="11" fill="#6e6759" text-anchor="middle">Smaller dots, faint grid</text>
  <text x="450" y="276" font-size="11" fill="#6e6759" text-anchor="middle">Prints 8 × 5.3 in</text>

  <rect x="606" y="90" width="250" height="200" rx="14" fill="#f5e9e3" stroke="#a03d28" stroke-width="1.5"/>
  <text x="731" y="118" font-size="15" font-weight="bold" fill="#2e7d4f" text-anchor="middle">300 DPI</text>
  <rect x="636" y="134" width="190" height="100" rx="4" fill="#c5bfb0"/>
  <text x="731" y="258" font-size="11" fill="#6e6759" text-anchor="middle">Dots invisible to the eye</text>
  <text x="731" y="276" font-size="11" fill="#6e6759" text-anchor="middle">Prints 4 × 2.7 in</text>

  <text x="450" y="310" font-size="12" fill="#6e6759" text-anchor="middle">All three use the same 1200 × 800 pixels — only the print size and dot density change.</text>
  <text x="44" y="336" font-size="11" fill="#b0a895">setdpi.com — set 300 DPI (or any value) losslessly</text>
</svg>
