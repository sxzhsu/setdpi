<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">Why 300 DPI is the industry default</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Dense enough for a 150-line halftone at arm’s length — the integer preflight actually checks.</text>

  <rect x="44" y="84" width="250" height="72" rx="10" fill="#f7f4ee"/>
  <text x="169" y="114" font-size="18" font-weight="bold" fill="#a03d28" text-anchor="middle">150 lpi</text>
  <text x="169" y="136" font-size="12" fill="#6e6759" text-anchor="middle">common magazine screen</text>

  <text x="314" y="126" font-size="18" fill="#6e6759">× 2</text>

  <rect x="350" y="84" width="250" height="72" rx="10" fill="#f7f4ee"/>
  <text x="475" y="114" font-size="18" font-weight="bold" fill="#a03d28" text-anchor="middle">300 DPI</text>
  <text x="475" y="136" font-size="12" fill="#6e6759" text-anchor="middle">photo-lab / offset habit</text>

  <text x="620" y="126" font-size="18" fill="#6e6759">=</text>

  <rect x="650" y="84" width="206" height="72" rx="10" fill="#f7f4ee"/>
  <text x="753" y="114" font-size="13" font-weight="600" fill="#1b1f28" text-anchor="middle">Grid invisible</text>
  <text x="753" y="136" font-size="12" fill="#6e6759" text-anchor="middle">at arm’s length</text>

  <rect x="44" y="176" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="197" font-size="12" font-weight="bold" fill="#6e6759">WHERE 300 IS REQUIRED</text>
  <text x="420" y="197" font-size="12" font-weight="bold" fill="#6e6759">WHAT PREFLIGHT WANTS</text>
  <text x="680" y="197" font-size="12" font-weight="bold" fill="#6e6759">PIXELS @ 300</text>

  <line x1="44" y1="212" x2="856" y2="212" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="236" font-size="13" font-weight="600" fill="#1b1f28">Print shops / photo labs</text>
  <text x="420" y="236" font-size="12" fill="#6e6759">A 72 tag is bounced as low-res</text>
  <text x="680" y="236" font-size="12" fill="#6e6759">1200 × 1800 → 4 × 6</text>

  <line x1="44" y1="252" x2="856" y2="252" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="276" font-size="13" font-weight="600" fill="#1b1f28">Magazines / journals</text>
  <text x="420" y="276" font-size="12" fill="#6e6759">Figures at 300; 600 for line art</text>
  <text x="680" y="276" font-size="12" fill="#6e6759">2400 × 3000 → 8 × 10</text>

  <line x1="44" y1="292" x2="856" y2="292" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="316" font-size="13" font-weight="600" fill="#1b1f28">ID / passport photos</text>
  <text x="420" y="316" font-size="12" fill="#6e6759">US 2 × 2 in at 300 DPI</text>
  <text x="680" y="316" font-size="12" fill="#6e6759">600 × 600 → 2 × 2</text>

  <line x1="44" y1="332" x2="856" y2="332" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="356" font-size="13" font-weight="600" fill="#1b1f28">Etsy / KDP / AI art</text>
  <text x="420" y="356" font-size="12" fill="#6e6759">Generators save at 72; rewrite 300</text>
  <text x="680" y="356" font-size="12" fill="#6e6759">2550 × 3300 → Letter</text>

  <text x="44" y="392" font-size="11" fill="#b0a895">setdpi.com — convert to 300 DPI without re-encoding</text>
</svg>
