<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">Bulk DPI — folder in, one zip out</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Drop a batch of JPG or PNG, set one density, download one archive. Pixels are never re-encoded. Nothing is uploaded.</text>

  <rect x="44" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="64" y="114" font-size="18" font-weight="bold" fill="#a03d28">1</text>
  <text x="64" y="140" font-size="13" font-weight="600" fill="#1b1f28">Drop files</text>
  <text x="64" y="160" font-size="12" fill="#6e6759">Up to 200 JPG/PNG</text>
  <text x="64" y="176" font-size="12" fill="#6e6759">per drop, in the browser</text>

  <polygon points="232,138 246,132 246,144" fill="#e6e0d0"/>

  <rect x="254" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="274" y="114" font-size="18" font-weight="bold" fill="#a03d28">2</text>
  <text x="274" y="140" font-size="13" font-weight="600" fill="#1b1f28">Set one DPI</text>
  <text x="274" y="160" font-size="12" fill="#6e6759">300 is the default</text>
  <text x="274" y="176" font-size="12" fill="#6e6759">or any 1–10000</text>

  <polygon points="442,138 456,132 456,144" fill="#e6e0d0"/>

  <rect x="464" y="88" width="178" height="100" rx="12" fill="#f7f4ee"/>
  <text x="484" y="114" font-size="18" font-weight="bold" fill="#a03d28">3</text>
  <text x="484" y="140" font-size="13" font-weight="600" fill="#1b1f28">Rewrite tags</text>
  <text x="484" y="160" font-size="12" fill="#6e6759">JPEG: JFIF / EXIF</text>
  <text x="484" y="176" font-size="12" fill="#6e6759">PNG: pHYs chunk</text>

  <polygon points="652,138 666,132 666,144" fill="#e6e0d0"/>

  <rect x="674" y="88" width="182" height="100" rx="12" fill="#f7f4ee"/>
  <text x="694" y="114" font-size="18" font-weight="bold" fill="#a03d28">4</text>
  <text x="694" y="140" font-size="13" font-weight="600" fill="#1b1f28">Download zip</text>
  <text x="694" y="160" font-size="12" fill="#6e6759">setdpi-300dpi-batch.zip</text>
  <text x="694" y="176" font-size="12" fill="#6e6759">STORE — no recompress</text>

  <rect x="44" y="208" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="229" font-size="12" font-weight="bold" fill="#6e6759">BUILT FOR</text>
  <text x="280" y="229" font-size="12" font-weight="bold" fill="#6e6759">LIMITS</text>
  <text x="560" y="229" font-size="12" font-weight="bold" fill="#6e6759">NAMING</text>

  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="272" font-size="13" font-weight="600" fill="#1b1f28">Print shops, POD / Etsy,</text>
  <text x="64" y="292" font-size="13" font-weight="600" fill="#1b1f28">photographers, archive scans</text>
  <text x="280" y="272" font-size="13" fill="#6e6759">200 files per drop · RAM only</text>
  <text x="280" y="292" font-size="13" fill="#6e6759">Zip refused above 800 MB</text>
  <text x="560" y="272" font-size="13" fill="#6e6759">photo.jpg → photo_300dpi.jpg</text>
  <text x="560" y="292" font-size="13" fill="#6e6759">UTF-8 names inside the zip</text>

  <text x="44" y="332" font-size="11" fill="#b0a895">setdpi.com — batch-set DPI losslessly and download one zip</text>
</svg>
