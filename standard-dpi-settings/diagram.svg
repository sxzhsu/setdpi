<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#fffdf9"/>
  <text x="44" y="42" font-size="20" font-weight="bold" fill="#1b1f28">Standard DPI settings at a glance</text>
  <text x="44" y="66" font-size="13" fill="#6e6759">Pick the tag that matches your output, not a one-size-fits-all number.</text>

  <rect x="44" y="88" width="812" height="32" rx="6" fill="#f7f4ee"/>
  <text x="64" y="109" font-size="12" font-weight="bold" fill="#6e6759">DPI</text>
  <text x="180" y="109" font-size="12" font-weight="bold" fill="#6e6759">COMMON NAME</text>
  <text x="420" y="109" font-size="12" font-weight="bold" fill="#6e6759">USED FOR</text>
  <text x="720" y="109" font-size="12" font-weight="bold" fill="#6e6759">NOTES</text>

  <line x1="44" y1="124" x2="856" y2="124" stroke="#e6e0d0" stroke-width="1"/>
  <text x="64" y="148" font-size="14" font-weight="700" fill="#a03d28">72</text>
  <text x="180" y="148" font-size="13" fill="#1b1f28">Screen / Mac legacy</text>
  <text x="420" y="148" font-size="12" fill="#6e6759">Web images, email</text>
  <text x="720" y="148" font-size="11" fill="#6e6759">Original Mac standard</text>

  <line x1="44" y1="164" x2="856" y2="164" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="188" font-size="14" font-weight="700" fill="#a03d28">96</text>
  <text x="180" y="188" font-size="13" fill="#1b1f28">Windows default</text>
  <text x="420" y="188" font-size="12" fill="#6e6759">Office docs, UI assets</text>
  <text x="720" y="188" font-size="11" fill="#6e6759">Windows assumed default</text>

  <line x1="44" y1="204" x2="856" y2="204" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="228" font-size="14" font-weight="700" fill="#a03d28">150</text>
  <text x="180" y="228" font-size="13" fill="#1b1f28">Draft print</text>
  <text x="420" y="228" font-size="12" fill="#6e6759">Proofs, internal docs</text>
  <text x="720" y="228" font-size="11" fill="#6e6759">Saves ink + paper</text>

  <line x1="44" y1="244" x2="856" y2="244" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="268" font-size="14" font-weight="700" fill="#a03d28">300</text>
  <text x="180" y="268" font-size="13" fill="#1b1f28">Photo / print standard</text>
  <text x="420" y="268" font-size="12" fill="#6e6759">Photos, magazines, cards</text>
  <text x="720" y="268" font-size="11" fill="#6e6759">Industry default</text>

  <line x1="44" y1="284" x2="856" y2="284" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="308" font-size="14" font-weight="700" fill="#a03d28">600</text>
  <text x="180" y="308" font-size="13" fill="#1b1f28">Fine art / line art</text>
  <text x="420" y="308" font-size="12" fill="#6e6759">Technical drawings, giclée</text>
  <text x="720" y="308" font-size="11" fill="#6e6759">Sharp edges / thin lines</text>

  <line x1="44" y1="324" x2="856" y2="324" stroke="#e6e0d0" stroke-width="0.5"/>
  <text x="64" y="348" font-size="14" font-weight="700" fill="#a03d28">1200</text>
  <text x="180" y="348" font-size="13" fill="#1b1f28">Pre-press / laser</text>
  <text x="420" y="348" font-size="12" fill="#6e6759">Book covers, packaging</text>
  <text x="720" y="348" font-size="11" fill="#6e6759">Overkill for photos</text>

  <text x="44" y="376" font-size="11" fill="#b0a895">setdpi.com — set any of these values without re-encoding</text>
</svg>
